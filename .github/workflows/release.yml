# Publishes a GitHub Release when a version tag is pushed (tag format of the Maven release plugin, e.g.
# application-personal-pages-1.0): builds the XAR from the tag, adds a SHA-256 checksum, and attaches both with the
# release notes from .github/release-notes/<version>.md.
name: Release

on:
  push:
    tags:
      - 'application-personal-pages-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check that the tag matches the POM version
        run: |
          VERSION="${GITHUB_REF_NAME#application-personal-pages-}"
          POM_VERSION="$(mvn --batch-mode --quiet --settings settings.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "Tag version: $VERSION, POM version: $POM_VERSION"
          test "$VERSION" = "$POM_VERSION"
          test -f ".github/release-notes/$VERSION.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and verify the XAR
        run: mvn --batch-mode --no-transfer-progress --settings settings.xml clean install
      - name: Checksum
        run: cd target && sha256sum "application-personal-pages-$VERSION.xar" > "application-personal-pages-$VERSION.xar.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/application-personal-pages-$VERSION.xar" \
            "target/application-personal-pages-$VERSION.xar.sha256" \
            --title "Personal Pages $VERSION" \
            --notes-file ".github/release-notes/$VERSION.md" \
            --verify-tag
